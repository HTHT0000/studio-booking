<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
FMFスタジオ予約
</title>

<style>

body{

font-family:sans-serif;
padding:20px;

}

.slot{

padding:15px;
margin:10px 0;

border:1px solid #aaa;

border-radius:10px;

display:flex;

justify-content:space-between;

}

button{

padding:8px 15px;

}

</style>

</head>

<body>

<h1>

FMFスタジオ予約

</h1>

<div id="slots">

</div>

<script type="module">

import {
initializeApp
}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

getDocs,

addDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",

authDomain:
"fmfstudio-817fc.firebaseapp.com",

projectId:
"fmfstudio-817fc",

storageBucket:
"fmfstudio-817fc.firebasestorage.app",

messagingSenderId:
"688053367950",

appId:
"1:688053367950:web:6996a72a133b2bebb885df"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const slotsDiv=
document.getElementById("slots");


const slots=[

"月1限",

"月2限",

"月3限",

"月4限",

"火1限",

"火2限",

"火3限"

];


async function load(){

slotsDiv.innerHTML="";

const docs=
await getDocs(

collection(
db,
"reservations"
)

);

const reserved=[];

docs.forEach(doc=>{

reserved.push(

doc.data().slot

);

});


slots.forEach(slot=>{

const taken=

reserved.includes(slot);

const div=

document.createElement("div");

div.className="slot";

div.innerHTML=

`

<div>

${slot}

${taken?

"🔴予約済":

"🟢空き"

}

</div>

<button

${taken?

"disabled":

""

}

onclick=

"reserve('${slot}')"

>

予約

</button>

`;

slotsDiv.appendChild(div);

});

}


window.reserve=

async(slot)=>{

const user=

prompt(

"名前"

);

if(!user)return;

await addDoc(

collection(

db,

"reservations"

),

{

slot,

user

}

);

load();

};


load();

</script>

</body>

</html>
