<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    /* テーブル全体のスタイル */
    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 15px 8px;
      text-align: center;
    }

    /* ヘッダー（時限）のスタイル */
    th {
      background: #4285F4;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #3474db;
      width: 70px;
    }

    /* 曜日列（一番左）のスタイル */
    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    /* 予約マスの共通スタイル */
    .slot-cell {
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 60px;
    }

    /* 空きマスのスタイル（ホバーで少し暗く） */
    .slot-available {
      color: #2bc06a;
      font-weight: bold;
    }
    .slot-available:hover {
      background: #eafaf1;
    }

    /* 予約済みマスのスタイル（クリック不可） */
    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: not-allowed;
      font-size: 0.9em;
    }
    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all; /* 名前が長い場合の改行対策 */
    }
  </style>
</head>

<body>

  <h1>FMFスタジオ予約</h1>
  
  <!-- 時刻表がここに生成されます -->
  <div id="timetable-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById("timetable-container");

    // 縦軸（行）：月曜日から日曜日までカバー
    const days = ["月", "火", "水", "木", "金", "土", "日"];
    // 横軸（列）：1限から7限、途中に昼休み
    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];

    // 予約処理
    async function reserve(slotKey) {
      const user = prompt("予約者の名前を入力してください：");
      if (!user) return;

      try {
        await addDoc(collection(db, "reservations"), {
          slot: slotKey, // 例: "土-3", "日-昼休み"
          user: user
        });
      } catch (error) {
        console.error("予約エラー:", error);
        alert("予約に失敗しました。");
      }
    }

    // Firebaseのデータをリアルタイム監視してテーブルを描画
    onSnapshot(collection(db, "reservations"), (snapshot) => {
      const reservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        reservedMap[data.slot] = data.user;
      });

      // テーブルの作成開始
      let tableHtml = `<table>`;
      
      // 1行目：ヘッダー（時限一覧）
      tableHtml += `<thead><tr><th>曜日</th>`;
      periods.forEach(p => {
        tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      // 2行目以降：各曜日のデータ
      days.forEach(day => {
        tableHtml += `<tr><td>${day}</td>`;
        
        periods.forEach(period => {
          const slotKey = `${day}-${period}`; // データベースに保存する一意のキー
          const reservedUser = reservedMap[slotKey];
          const isTaken = !!reservedUser;

          if (isTaken) {
            // 予約済み（❌表記と名前）
            tableHtml += `
              <td class="slot-cell slot-taken">
                ❌<span class="username">${reservedUser}</span>
              </td>`;
          } else {
            // 空き（○表記、クリックで予約可能）
            tableHtml += `
              <td class="slot-cell slot-available" data-slot="${slotKey}">
                ○
              </td>`;
          }
        });
        
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      // 空いている「○」のマスだけにクリックイベントを設定
      container.querySelectorAll(".slot-available").forEach(cell => {
        cell.onclick = () => {
          const slotKey = cell.getAttribute("data-slot");
          reserve(slotKey);
        };
      });
    });
  </script>
</body>

</html>
