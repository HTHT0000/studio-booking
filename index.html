<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 6px;
      text-align: center;
    }

    th {
      background: #4285F4;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #3474db;
      width: 130px;
    }

    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    .day-sat { color: #2f80ed; }
    .day-sun { color: #eb5757; }

    /* 1週目と2週目の区切りを視覚的に分かりやすく */
    .week-boundary {
      border-top: 3px double #333 !important;
    }

    .slot-cell {
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 65px;
    }

    .slot-available {
      color: #2bc06a;
      font-weight: bold;
    }
    .slot-available:hover {
      background: #eafaf1;
    }

    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: not-allowed;
      font-size: 0.9em;
    }
    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>FMFスタジオ予約</h1>
  <div id="timetable-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById("timetable-container");

    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];
    const dayLabels = ["日", "月", "火", "水", "木", "金", "土"];

    // 今日から2週間分の日付リストを生成（何週目かの判定用フラグを追加）
    function generateTwoWeeksList() {
      const list = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        
        list.push({
          dateStr: `${month}/${date}`,
          dayOfWeek: dayLabels[d.getDay()],
          dayIndex: d.getDay(),
          isSecondWeek: i >= 7, // 💡 8日目以降なら「2週目」と判定
          dbKey: `${year}-${month}-${date}`
        });
      }
      return list;
    }

    const targetDays = generateTwoWeeksList();

    // 予約制限のチェックロジック
    function checkReservationLimit(type) {
      const today = new Date();
      const currentDayIndex = today.getDay(); // 今日の曜日 (0:日, 1:月, 2:火...)

      // 今日が「1週目のどの曜日を過ぎているか」を判定
      // ※日曜日から始まるため、条件分岐で曜日ごとのルールをチェックします
      if (type === "バンド") {
        // 1週目の日曜日（0）以降ならOK
        return currentDayIndex >= 0; 
      }
      if (type === "ドラム") {
        // 1週目の火曜日（2）以降ならOK (火(2), 水(3), 木(4), 金(5), 土(6) はOK。日(0), 月(1)はまだダメ)
        return currentDayIndex >= 2 || currentDayIndex === 0; // 日曜日は前の週の日曜なので実質今週なら2以上
      }
      if (type === "個人") {
        // 1週目の水曜日（3）以降ならOK
        return currentDayIndex >= 3 || currentDayIndex === 0;
      }
      return false;
    }

    // 予約処理
    async function reserve(slotKey, isSecondWeek) {
      // 1. まず予約の種類（立場）を選択してもらう
      const type = prompt("予約の種類を入力してください\n【 バンド / ドラム / 個人 】");
      if (!type) return;

      const cleanedType = type.trim();
      if (!["バンド", "ドラム", "個人"].includes(cleanedType)) {
        alert("「バンド」「ドラム」「個人」のいずれかを入力してください。");
        return;
      }

      // 2. 2週目のマスの場合は、曜日ルールに達しているかチェック
      if (isSecondWeek) {
        const today = new Date();
        const currentDay = today.getDay();
        
        // 解放条件の判定
        let isAllowed = false;
        if (cleanedType === "バンド" && currentDay === 0) isAllowed = true; // 日曜日
        if (cleanedType === "ドラム" && (currentDay === 2 || currentDay === 3 || currentDay === 4 || currentDay === 5 || currentDay === 6 || currentDay === 0)) isAllowed = true; // 火曜日以降（日含む）
        if (cleanedType === "個人" && (currentDay === 3 || currentDay === 4 || currentDay === 5 || currentDay === 6 || currentDay === 0)) isAllowed = true; // 水曜日以降（日含む）
        
        // ※JavaScriptの日曜(0)〜土曜(6)の仕様に合わせた厳密な曜日判定
        const todayScore = currentDay === 0 ? 7 : currentDay; // 月1〜日7に変換
        let requiredScore = 7; // バンドは日(7)
        if (cleanedType === "ドラム") requiredScore = 2; // 火(2)
        if (cleanedType === "個人") requiredScore = 3; // 水(3)

        if (todayScore < requiredScore) {
          alert(`❌ ${cleanedType}の場合、1週目の${cleanedType === "バンド" ? "日" : cleanedType === "ドラム" ? "火" : "水"}曜日になるまで2週目の予約はできません。`);
          return;
        }
      }

      // 3. 名前を入力してもらう
      const user = prompt(`【${cleanedType}】予約者の名前を入力してください：`);
      if (!user) return;

      try {
        await addDoc(collection(db, "reservations"), {
          slot: slotKey,
          user: `${cleanedType}:${user}` // データベースに種類と名前を一緒に保存（例: "バンド:山田"）
        });
      } catch (error) {
        console.error("予約エラー:", error);
        alert("予約に失敗しました。");
      }
    }

    // Firebaseデータの監視と描画
    onSnapshot(collection(db, "reservations"), (snapshot) => {
      const reservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        reservedMap[data.slot] = data.user;
      });

      let tableHtml = `<table>`;
      tableHtml += `<thead><tr><th>日付 (曜日)</th>`;
      periods.forEach(p => {
        tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      targetDays.forEach((dayInfo, index) => {
        let dayClass = "";
        if (dayInfo.dayIndex === 6) dayClass = "day-sat";
        if (dayInfo.dayIndex === 0) dayClass = "day-sun";

        // 2週目の最初の行（インデックス7）に境界線用のクラスをつける
        const rowClass = index === 7 ? "week-boundary" : "";

        tableHtml += `<tr class="${rowClass}"><td class="${dayClass}">${dayInfo.dateStr} (${dayInfo.dayOfWeek})</td>`;
        
        periods.forEach(period => {
          const slotKey = `${dayInfo.dbKey}_${period}`; 
          const reservedData = reservedMap[slotKey];
          const isTaken = !!reservedData;

          if (isTaken) {
            // "種類:名前" で保存されているので、表示用に分割
            const [savedType, savedName] = reservedData.split(":");
            tableHtml += `
              <td class="slot-cell slot-taken">
                ❌<span class="username">[${savedType}] ${savedName || reservedData}</span>
              </td>`;
          } else {
            tableHtml += `
              <td class="slot-cell slot-available" data-slot="${slotKey}" data-second-week="${dayInfo.isSecondWeek}">
                ○
              </td>`;
          }
        });
        
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      container.querySelectorAll(".slot-available").forEach(cell => {
        cell.onclick = () => {
          const slotKey = cell.getAttribute("data-slot");
          const isSecondWeek = cell.getAttribute("data-second-week") === "true";
          reserve(slotKey, isSecondWeek);
        };
      });
    });
  </script>
</body>

</html>
