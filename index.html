<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    /* 予約フォームのスタイル */
    .reservation-form {
      max-width: 950px;
      margin: 0 auto 25px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column; /* 縦並びにして見やすく */
      gap: 15px;
      align-items: center;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-label {
      font-weight: bold;
      color: #444;
    }

    /* 💡 区分選択ボタンのスタイル */
    .type-btn-group {
      display: flex;
      gap: 10px;
    }

    .type-btn {
      padding: 10px 20px;
      border: 2px solid #4285F4;
      background: white;
      color: #4285F4;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }

    /* 💡 選択されているボタンのスタイル */
    .type-btn.active {
      background: #4285F4;
      color: white;
    }

    .name-input {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      width: 220px;
    }

    /* テーブル全体のスタイル */
    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 6px;
      text-align: center;
    }

    th {
      background: #4285F4;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #3474db;
      width: 130px;
    }

    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    .day-sat { color: #2f80ed; }
    .day-sun { color: #eb5757; }

    /* 2週目の区切り線 */
    .week-boundary td {
      border-top: 3px double #333 !important;
    }

    .slot-cell {
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 65px;
    }

    .slot-available {
      color: #2bc06a;
      font-weight: bold;
    }
    .slot-available:hover {
      background: #eafaf1;
    }

    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: not-allowed;
      font-size: 0.9em;
    }
    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>FMFスタジオ予約</h1>

  <!-- 入力フォームエリア -->
  <div class="reservation-form">
    <div class="form-row">
      <span class="form-label">1. 予約の種類を選んでください：</span>
      <div class="type-btn-group">
        <!-- 初期状態でバンドに active クラスをつけています -->
        <button type="button" class="type-btn active" data-type="バンド">バンド</button>
        <button type="button" class="type-btn" data-type="ドラム">ドラム</button>
        <button type="button" class="type-btn" data-type="個人">個人</button>
      </div>
    </div>
    
    <div class="form-row">
      <label for="user-name" class="form-label">2. 名前を入力してください：</label>
      <input type="text" id="user-name" class="name-input" placeholder="例：山田太郎">
    </div>
  </div>
  
  <!-- 時刻表がここに生成されます -->
  <div id="timetable-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById("timetable-container");

    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];
    const dayLabels = ["日", "月", "火", "水", "木", "金", "土"];

    // 現在選択されている種類を管理する変数（デフォルト：バンド）
    let selectedType = "バンド";

    /* 💡 種類選択ボタンの切り替えイベントを設定 */
    document.querySelectorAll(".type-btn").forEach(btn => {
      btn.onclick = () => {
        // すべてのボタンから active クラスを消す
        document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
        // クリックされたボタンに active クラスをつける
        btn.classList.add("active");
        // 選択された値を保持
        selectedType = btn.getAttribute("data-type");
      };
    });

    // 今日から14日間を生成
    function generateTwoWeeksList() {
      const list = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        
        list.push({
          dateStr: `${month}/${date}`,
          dayOfWeek: dayLabels[d.getDay()],
          dayIndex: d.getDay(),
          isSecondWeek: i >= 7,
          dbKey: `${year}-${month}-${date}`
        });
      }
      return list;
    }

    const targetDays = generateTwoWeeksList();

    // 予約処理
    async function reserve(slotKey, isSecondWeek) {
      const nameInput = document.getElementById('user-name');
      const userName = nameInput.value.trim();
      
      if (!userName) {
        alert("名前を入力してください。");
        return;
      }

      // 2週目の制限チェック
      if (isSecondWeek) {
        const today = new Date();
        const currentDay = today.getDay(); // 0:日, 1:月...
        
        const todayScore = currentDay === 0 ? 7 : currentDay; 
        
        let requiredScore = 7; // バンドは日曜日(7)以降
        if (selectedType === "ドラム") requiredScore = 2; // 火曜日(2)以降
        if (selectedType === "個人") requiredScore = 3; // 水曜日(3)以降

        if (todayScore < requiredScore) {
          alert(`❌ ${selectedType}の場合、1週目の${selectedType === "バンド" ? "日" : selectedType === "ドラム" ? "火" : "水"}曜日になるまで2週目の予約はできません。`);
          return;
        }
      }

      // 確認メッセージ
      if (!confirm(`${slotKey.replace('_', ' ')}の枠を [${selectedType}] ${userName} で予約しますか？`)) {
        return;
      }

      try {
        await addDoc(collection(db, "reservations"), {
          slot: slotKey,
          user: `${selectedType}:${userName}`
        });
        
        // 予約が成功したら名前欄をクリア
        nameInput.value = "";
      } catch (error) {
        console.error("予約エラー:", error);
        alert("予約に失敗しました。");
      }
    }

    // Firebaseデータ監視
    onSnapshot(collection(db, "reservations"), (snapshot) => {
      const reservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        reservedMap[data.slot] = data.user;
      });

      let tableHtml = `<table>`;
      tableHtml += `<thead><tr><th>日付 (曜日)</th>`;
      periods.forEach(p => {
        tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      targetDays.forEach((dayInfo, index) => {
        let dayClass = "";
        if (dayInfo.dayIndex === 6) dayClass = "day-sat";
        if (dayInfo.dayIndex === 0) dayClass = "day-sun";

        const rowClass = index === 7 ? "week-boundary" : "";

        tableHtml += `<tr class="${rowClass}"><td class="${dayClass}">${dayInfo.dateStr} (${dayInfo.dayOfWeek})</td>`;
        
        periods.forEach(period => {
          const slotKey = `${dayInfo.dbKey}_${period}`; 
          const reservedData = reservedMap[slotKey];
          const isTaken = !!reservedData;

          if (isTaken) {
            let displayValue = reservedData;
            if (typeof reservedData === 'string' && reservedData.includes(':')) {
              const [savedType, savedName] = reservedData.split(':');
              displayValue = `[${savedType}] ${savedName}`;
            }
            
            tableHtml += `
              <td class="slot-cell slot-taken">
                ❌<span class="username">${displayValue}</span>
              </td>`;
          } else {
            tableHtml += `
              <td class="slot-cell slot-available" data-slot="${slotKey}" data-second-week="${dayInfo.isSecondWeek}">
                ○
              </td>`;
          }
        });
        
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      container.querySelectorAll(".slot-available").forEach(cell => {
        cell.onclick = () => {
          const slotKey = cell.getAttribute("data-slot");
          const isSecondWeek = cell.getAttribute("data-second-week") === "true";
          reserve(slotKey, isSecondWeek);
        };
      });
    });
  </script>
</body>

</html>
