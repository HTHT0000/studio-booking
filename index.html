<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約 - 管理者設定</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
    .setting-group { margin-bottom: 25px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
    .setting-group h3 { margin-top: 0; color: #2980b9; }
    .form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .form-row:last-child { margin-bottom: 0; }
    label { font-weight: bold; font-size: 0.95em; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 120px; box-sizing: border-box; font-size: 1em; }
    .btn-container { text-align: center; margin-top: 30px; }
    .save-btn { background: #2bc06a; color: white; border: none; padding: 12px 40px; font-size: 1.1em; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s; width: 100%; }
    .save-btn:hover { background: #25a259; }
    .loading { text-align: center; font-weight: bold; color: #7f8c8d; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚙️ スタジオ予約 管理者設定</h1>
  <div id="loading-msg" class="loading">現在の設定を読み込み中...</div>
  
  <form id="settings-form" style="display: none;">
    <!-- バンド設定 -->
    <div class="setting-group">
      <h3>🎸 バンド予約 ルール</h3>
      <div class="form-row">
        <label>週の上限枠数：</label>
        <input type="number" id="limit-band" min="1" max="99" required>
      </div>
      <div class="form-row">
        <label>来週分の予約開始曜日：</label>
        <select id="day-band">
          <option value="0">日曜日 (即時)</option>
          <option value="1">月曜日</option>
          <option value="2">火曜日</option>
          <option value="3">水曜日</option>
          <option value="4">木曜日</option>
          <option value="5">金曜日</option>
          <option value="6">土曜日</option>
        </select>
      </div>
    </div>

    <!-- ドラム設定 -->
    <div class="setting-group">
      <h3>🥁 ドラム個人 ルール</h3>
      <div class="form-row">
        <label>週の上限枠数：</label>
        <input type="number" id="limit-drum" min="1" max="99" required>
      </div>
      <div class="form-row">
        <label>来週分の予約開始曜日：</label>
        <select id="day-drum">
          <option value="0">日曜日 (即時)</option>
          <option value="1">月曜日</option>
          <option value="2">火曜日</option>
          <option value="3">水曜日</option>
          <option value="4">木曜日</option>
          <option value="5">金曜日</option>
          <option value="6">土曜日</option>
        </select>
      </div>
    </div>

    <!-- 個人設定 -->
    <div class="setting-group">
      <h3>🎤 個人練習 ルール</h3>
      <div class="form-row">
        <label>週の上限枠数：</label>
        <input type="number" id="limit-solo" min="1" max="99" required>
      </div>
      <div class="form-row">
        <label>来週分の予約開始曜日：</label>
        <select id="day-solo">
          <option value="0">日曜日 (即時)</option>
          <option value="1">月曜日</option>
          <option value="2">火曜日</option>
          <option value="3">水曜日</option>
          <option value="4">木曜日</option>
          <option value="5">金曜日</option>
          <option value="6">土曜日</option>
        </select>
      </div>
    </div>

    <div class="btn-container">
      <button type="submit" class="save-btn">設定を保存して適用する</button>
    </div>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 既存のFirebaseConfig
  const firebaseConfig = {
    apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
    authDomain: "fmfstudio-817fc.firebaseapp.com",
    projectId: "fmfstudio-817fc",
    storageBucket: "fmfstudio-817fc.firebasestorage.app",
    messagingSenderId: "688053367950",
    appId: "1:688053367950:web:6996a72a133b2bebb885df"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ドキュメントIDを "current_rules" で固定して管理
  const rulesRef = doc(db, "studiosettings", "current_rules");

  // 初期値（データがまだ無い場合のフォールバック）
  const defaultRules = {
    band: { limit: 99, startDay: 0 }, // バンドは制限なし(99)、日曜日から
    drum: { limit: 4,  startDay: 2 }, // ドラムは4枠、火曜日(2)から
    solo: { limit: 4,  startDay: 3 }  // 個人は4枠、水曜日(3)から
  };

  // ページを開いた時に現在の設定を読み込む
  async function loadSettings() {
    try {
      const docSnap = await getDoc(rulesRef);
      let rules = defaultRules;

      if (docSnap.exists()) {
        rules = docSnap.data();
      }

      // フォームに値をセット
      document.getElementById("limit-band").value = rules.band.limit;
      document.getElementById("day-band").value = rules.band.startDay;
      document.getElementById("limit-drum").value = rules.drum.limit;
      document.getElementById("day-drum").value = rules.drum.startDay;
      document.getElementById("limit-solo").value = rules.solo.limit;
      document.getElementById("day-solo").value = rules.solo.startDay;

      // ローディングを消してフォームを表示
      document.getElementById("loading-msg").style.display = "none";
      document.getElementById("settings-form").style.display = "block";
    } catch (e) {
      console.error("読み込みエラー:", e);
      alert("設定の読み込みに失敗しました。");
    }
  }

  // 保存処理
  document.getElementById("settings-form").onsubmit = async (e) => {
    e.preventDefault();
    
    const newRules = {
      band: {
        limit: parseInt(document.getElementById("limit-band").value),
        startDay: parseInt(document.getElementById("day-band").value)
      },
      drum: {
        limit: parseInt(document.getElementById("limit-drum").value),
        startDay: parseInt(document.getElementById("day-drum").value)
      },
      solo: {
        limit: parseInt(document.getElementById("limit-solo").value),
        startDay: parseInt(document.getElementById("day-solo").value)
      }
    };

    try {
      await setDoc(rulesRef, newRules);
      alert("🎉 設定をデータベースに保存しました！ユーザーページに即時適用されます。");
    } catch (e) {
      console.error("保存エラー:", e);
      alert("設定の保存に失敗しました。");
    }
  };

  loadSettings();
</script>
</body>
</html>
