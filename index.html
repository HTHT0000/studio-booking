<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .reservation-form {
      max-width: 950px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-label {
      font-weight: bold;
      color: #444;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      padding: 10px 20px;
      border: 2px solid #4285F4;
      background: white;
      color: #4285F4;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: #4285F4;
      color: white;
    }

    .week-btn {
      border-color: #34495e;
      color: #34495e;
    }
    .week-btn.active {
      background: #34495e;
      color: white;
    }

    .name-input {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      width: 220px;
    }

    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 6px;
      text-align: center;
    }

    th {
      background: #4285F4;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #3474db;
      width: 140px;
    }

    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    .day-sat { color: #2f80ed; }
    .day-sun { color: #eb5757; }

    .today-row {
      background-color: #fff9db !important;
    }
    .today-row td:first-child {
      background-color: #fff3bf !important;
      position: relative;
    }
    .today-row td:first-child::after {
      content: " TODAY";
      font-size: 0.7em;
      color: #e67e22;
      display: block;
    }

    .slot-cell {
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 65px;
      user-select: none;
    }

    .slot-available {
      color: #2bc06a;
      font-weight: bold;
    }
    .slot-available:hover {
      background: #eafaf1;
    }

    .slot-available.selected {
      background: #e3f2fd !important;
      color: #1565c0 !important;
      outline: 2px solid #1565c0;
    }

    .slot-past {
      background: #f2f2f2;
      color: #aaa;
      cursor: not-allowed;
    }
    .slot-past:hover {
      background: #f2f2f2;
    }

    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: not-allowed;
      font-size: 0.9em;
    }
    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all;
    }

    .action-container {
      max-width: 950px;
      margin: 20px auto 0 auto;
      text-align: center;
    }

    .submit-btn {
      background: #2bc06a;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #25a259;
    }
  </style>
</head>

<body>

  <div style="text-align: center;">
    <h1>FMFスタジオ予約</h1>
  </div>

  <div class="reservation-form">
    <div class="form-row">
      <span class="form-label">1. 予約の種類を選んでください：</span>
      <div class="btn-group">
        <button type="button" class="toggle-btn active" data-type="バンド">バンド</button>
        <button type="button" class="toggle-btn" data-type="ドラム">ドラム</button>
        <button type="button" class="toggle-btn" data-type="個人">個人</button>
      </div>
    </div>
    
    <div class="form-row">
      <label for="user-name" class="form-label">2. 名前を入力してください：</label>
      <input type="text" id="user-name" class="name-input" placeholder="例：山田太郎">
    </div>

    <div class="form-row" style="margin-top: 5px; border-top: 1px dashed #ddd; padding-top: 15px; width: 100%;">
      <span class="form-label">表示する週：</span>
      <div class="btn-group">
        <button type="button" id="btn-week1" class="toggle-btn week-btn active" data-week="1">1ページ目 (今週)</button>
        <button type="button" id="btn-week2" class="toggle-btn week-btn" data-week="2">2ページ目 (来週)</button>
      </div>
    </div>
  </div>
  
  <div id="timetable-container"></div>

  <div class="action-container">
    <button type="button" id="submit-reservation" class="submit-btn">選択したコマを一括予約する</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let selectedType = "バンド";
    let currentWeekView = "1"; 
    let selectedSlots = new Set(); 
    let globalReservedMap = {}; 

    // 💡 管理者が変更するルール設定の読み込み用オブジェクト（デフォルト値）
    let currentSystemConfig = {
      limitBand: 99, limitDrum: 1, limitPersonal: 1,
      dayDrum: 2, dayPersonal: 3, forceUnlock: false
    };

    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];
    const dayLabels = ["日", "月", "火", "水", "木", "金", "土"];

    function getRealToday() { return new Date(); }
    function getStartSunday() {
      const today = getRealToday();
      const startSun = new Date(today);
      startSun.setDate(today.getDate() - today.getDay()); 
      return startSun;
    }

    document.querySelectorAll("[data-type]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[data-type]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedType = btn.getAttribute("data-type");
        selectedSlots.clear();
        renderTable();
      };
    });

    document.querySelectorAll("[data-week]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[data-week]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentWeekView = btn.getAttribute("data-week");
        renderTable();
      };
    });

    function generateTwoWeeksList() {
      const list = [];
      const startSun = getStartSunday(); 
      const today = getRealToday();
      today.setHours(0,0,0,0);

      for (let i = 0; i < 14; i++) {
        const d = new Date(startSun);
        d.setDate(startSun.getDate() + i);
        const compareDate = new Date(d);
        compareDate.setHours(0,0,0,0);

        list.push({
          dateStr: `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`,
          dayOfWeek: dayLabels[d.getDay()],
          dayIndex: d.getDay(),
          isToday: compareDate.getTime() === today.getTime(), 
          isPast: compareDate.getTime() < today.getTime(),   
          isSecondWeek: i >= 7, 
          dbKey: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
        });
      }
      return list;
    }
    
    const targetDays = generateTwoWeeksList();

    function updateUIElements() {
      const w1Start = targetDays[0].dateStr;
      const w1End = targetDays[6].dateStr;
      const w2Start = targetDays[7].dateStr;
      const w2End = targetDays[13].dateStr;
      document.getElementById("btn-week1").innerText = `1ページ目 (今週: ${w1Start}〜${w1End})`;
      document.getElementById("btn-week2").innerText = `2ページ目 (来週: ${w2Start}〜${w2End})`;
    }
    updateUIElements();

    function renderTable() {
      const container = document.getElementById("timetable-container");
      const displayDays = targetDays.filter(day => currentWeekView === "1" ? !day.isSecondWeek : day.isSecondWeek);

      let tableHtml = `<table><thead><tr><th>日付 (曜日)</th>`;
      periods.forEach(p => { tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`; });
      tableHtml += `</tr></thead><tbody>`;

      displayDays.forEach(dayInfo => {
        let dayClass = "";
        if (dayInfo.dayIndex === 6) dayClass = "day-sat";
        if (dayInfo.dayIndex === 0) dayClass = "day-sun";
        const rowClass = dayInfo.isToday ? "today-row" : "";

        tableHtml += `<tr class="${rowClass}"><td class="${dayClass}">${dayInfo.dateStr} (${dayInfo.dayOfWeek})</td>`;
        
        periods.forEach(period => {
          const slotKey = `${dayInfo.dbKey}_${period}`; 
          const reservedData = globalReservedMap[slotKey];

          if (reservedData) {
            let displayValue = reservedData;
            if (typeof reservedData === 'string' && reservedData.includes(':')) {
              const [savedType, savedName] = reservedData.split(':');
              displayValue = `[${savedType}] ${savedName}`;
            }
            tableHtml += `<td class="slot-cell slot-taken">❌<span class="username">${displayValue}</span></td>`;
          } else if (dayInfo.isPast) {
            tableHtml += `<td class="slot-cell slot-past">ー</td>`;
          } else {
            const isSelected = selectedSlots.has(slotKey) ? "selected" : "";
            tableHtml += `<td class="slot-cell slot-available ${isSelected}" data-slot="${slotKey}">${selectedSlots.has(slotKey) ? "✓" : "○"}</td>`;
          }
        });
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      container.querySelectorAll(".slot-available").forEach(cell => {
        cell.onclick = () => {
          const slotKey = cell.getAttribute("data-slot");
          if (selectedSlots.has(slotKey)) {
            selectedSlots.delete(slotKey);
            cell.classList.remove("selected");
            cell.innerText = "○";
          } else {
            selectedSlots.add(slotKey);
            cell.classList.add("selected");
            cell.innerText = "✓";
          }
        };
      });
    }

    document.getElementById("submit-reservation").onclick = async () => {
      const nameInput = document.getElementById('user-name');
      const userName = nameInput.value.trim();
      if (!userName) { alert("名前を入力してください。"); return; }
      if (selectedSlots.size === 0) { alert("予約したいコマを選択してください。"); return; }

      // 💡 1. コマ数制限のリアルタイムチェック
      let currentTypeLimit = currentSystemConfig.limitBand;
      if (selectedType === "ドラム") currentTypeLimit = currentSystemConfig.limitDrum;
      if (selectedType === "個人") currentTypeLimit = currentSystemConfig.limitPersonal;

      // すでにデータベースに入っているこのユーザーの同じタイプの予約数を数える
      let alreadyReservedCount = 0;
      Object.values(globalReservedMap).forEach(val => {
        if (val === `${selectedType}:${userName}`) {
          alreadyReservedCount++;
        }
      });

      // 新しく選んだ数と合計して制限を超えていないかチェック
      if ((alreadyReservedCount + selectedSlots.size) > currentTypeLimit) {
        alert(`❌ 予約エラー\n\n【理由】${selectedType}の予約は一人最大 ${currentTypeLimit} コマまでです。\n（現在すでに ${alreadyReservedCount} コマ予約があります。今回選択した数: ${selectedSlots.size} コマ）`);
        return;
      }

      // 💡 2. 来週の予約解放チェック（強制解放がONならスキップ）
      if (!currentSystemConfig.forceUnlock) {
        const today = getRealToday();
        const currentDay = today.getDay(); 
        const todayScore = currentDay === 0 ? 7 : currentDay; 

        for (let slotKey of selectedSlots) {
          const slotDateStr = slotKey.split('_')[0]; 
          const isSecondWeekSlot = targetDays.find(d => d.dbKey === slotDateStr)?.isSecondWeek;

          if (isSecondWeekSlot) {
            if (selectedType === "バンド") continue; // バンドは通常いつでも可

            let requiredScore = 7; 
            if (selectedType === "ドラム") requiredScore = currentSystemConfig.dayDrum; 
            if (selectedType === "個人") requiredScore = currentSystemConfig.dayPersonal;   

            // 0は制限なし扱い
            if (requiredScore !== 0 && todayScore < requiredScore) {
              const weekNames = ["日", "月", "火", "水", "木", "金", "土"];
              alert(`❌ 予約を中断しました。\n\n【理由】管理者の設定により、${selectedType}の来週の予約は【${weekNames[requiredScore]}曜日】になるまでロックされています。`);
              return; 
            }
          }
        }
      }

      if (!confirm(`選択された ${selectedSlots.size} 個の枠を\n[${selectedType}] ${userName} で一括予約しますか？`)) return;

      try {
        const promises = Array.from(selectedSlots).map(slotKey => {
          return addDoc(collection(db, "reservations"), { slot: slotKey, user: `${selectedType}:${userName}` });
        });
        await Promise.all(promises);
        alert("🎉 予約が完了しました！");
        selectedSlots.clear();
        nameInput.value = "";
      } catch (error) {
        alert("予約に失敗しました。");
      }
    };

    // 💡 データベースの設定データをリアルタイム監視
    onSnapshot(doc(db, "system_config", "current"), (docSnap) => {
      if (docSnap.exists()) {
        currentSystemConfig = docSnap.data();
      }
    });

    onSnapshot(collection(db, "reservations"), (snapshot) => {
      globalReservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        globalReservedMap[data.slot] = data.user;
      });
      renderTable();
    });
  </script>
</body>
</html>
