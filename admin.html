<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約 | 管理者画面</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: #c0392b;
      margin-bottom: 5px;
    }

    .admin-badge {
      text-align: center;
      background: #fce4d6;
      color: #d35400;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* ⚙️ ルール設定パネルのスタイル */
    .config-panel {
      max-width: 950px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border: 2px solid #2980b9;
    }

    .config-title {
      font-size: 1.2em;
      font-weight: bold;
      color: #2980b9;
      margin-bottom: 15px;
      border-bottom: 2px solid #2980b9;
      padding-bottom: 5px;
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 15px;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-label {
      font-weight: bold;
      color: #333;
    }

    .config-input {
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 50px;
      text-align: center;
    }

    .config-select {
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .save-config-btn {
      background: #2980b9;
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-config-btn:hover {
      background: #1f618d;
    }

    /* 表示週切り替えなど既存のスタイル */
    .reservation-form {
      max-width: 950px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-label {
      font-weight: bold;
      color: #444;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      padding: 10px 20px;
      border: 2px solid #e74c3c;
      background: white;
      color: #e74c3c;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }

    .week-btn {
      border-color: #34495e;
      color: #34495e;
    }
    .week-btn.active {
      background: #34495e;
      color: white;
    }

    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 6px;
      text-align: center;
    }

    th {
      background: #e74c3c;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #c0392b;
      width: 140px;
    }

    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    .day-sat { color: #2f80ed; }
    .day-sun { color: #eb5757; }

    .today-row {
      background-color: #fff9db !important;
    }
    .today-row td:first-child {
      background-color: #fff3bf !important;
      position: relative;
    }
    .today-row td:first-child::after {
      content: " TODAY";
      font-size: 0.7em;
      color: #e67e22;
      display: block;
    }

    .slot-cell {
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 65px;
      user-select: none;
    }

    .slot-available {
      color: #bbb;
      background: #fafafa;
      font-size: 0.9em;
      cursor: not-allowed;
    }

    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: bold;
    }
    .slot-taken:hover {
      background: #ffe3e3;
    }

    .slot-taken.selected-to-delete {
      background: #ffd3d3 !important;
      color: #c0392b !important;
      outline: 2px solid #c0392b;
    }

    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all;
    }

    .action-container {
      max-width: 950px;
      margin: 20px auto 0 auto;
      text-align: center;
    }

    .submit-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>

  <div style="text-align: center;">
    <h1>FMFスタジオ予約【管理者専用】</h1>
    <div class="admin-badge">💡 ルールの変更や、削除したい「❌マークの予約枠」の一括削除ができます。</div>
  </div>

  <!-- ⚙️ ルール設定パネル -->
  <div class="config-panel">
    <div class="config-title">⚙️ 予約ルールのリアルタイム設定</div>
    
    <div class="config-row">
      <!-- 枠数制限 -->
      <div class="config-group">
        <span class="config-label">一人あたりの最大予約コマ数 ➔ </span>
        <span class="config-label">バンド:</span>
        <input type="number" id="limit-band" class="config-input" min="1" value="99">
        <span class="config-label">ドラム:</span>
        <input type="number" id="limit-drum" class="config-input" min="1" value="1">
        <span class="config-label">個人:</span>
        <input type="number" id="limit-personal" class="config-input" min="1" value="1">
      </div>
    </div>

    <div class="config-row">
      <!-- 曜日制限 -->
      <div class="config-group">
        <span class="config-label">来週の予約を解放する通常ルール:</span>
        <span class="config-label">ドラムは</span>
        <select id="day-drum" class="config-select">
          <option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="0">制限なし</option>
        </select>
        <span class="config-label">から / 個人は</span>
        <select id="day-personal" class="config-select">
          <option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="0">制限なし</option>
        </select>
        <span class="config-label">から</span>
      </div>
    </div>

    <div class="config-row" style="border-top: 1px dashed #ddd; padding-top: 15px; width: 100%; justify-content: space-between; align-items: center;">
      <!-- 即時強制解放スイッチ -->
      <div class="config-group">
        <span class="config-label" style="color: #c0392b;">🚨 来週の予約枠をいまスグ全員に強制解放する：</span>
        <select id="force-unlock" class="config-select" style="border-color: #c0392b; font-weight: bold;">
          <option value="false">通常ルール適用（曜日制限を守る）</option>
          <option value="true">強制解放する（誰でも今すぐ来週を予約可能）</option>
        </select>
      </div>

      <button type="button" id="save-config" class="save-config-btn">⚙️ このルールを適用する</button>
    </div>
  </div>

  <!-- 制御エリア -->
  <div class="reservation-form">
    <div class="form-row" style="width: 100%;">
      <span class="form-label">表示する週：</span>
      <div class="btn-group">
        <button type="button" id="btn-week1" class="toggle-btn week-btn active" data-week="1">1ページ目 (今週)</button>
        <button type="button" id="btn-week2" class="toggle-btn week-btn" data-week="2">2ページ目 (来週)</button>
      </div>
    </div>
  </div>
  
  <!-- 時刻表 -->
  <div id="timetable-container"></div>

  <!-- 一括削除ボタン -->
  <div class="action-container">
    <button type="button" id="submit-delete" class="submit-btn">選択した予約を一括削除する</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, writeBatch, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentWeekView = "1"; 
    let selectedDocIds = new Set(); 
    let globalReservedMap = {}; 

    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];
    const dayLabels = ["日", "月", "火", "水", "木", "金", "土"];

    function getRealToday() { return new Date(); }
    function getStartSunday() {
      const today = getRealToday();
      const startSun = new Date(today);
      startSun.setDate(today.getDate() - today.getDay()); 
      return startSun;
    }

    document.querySelectorAll("[data-week]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[data-week]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentWeekView = btn.getAttribute("data-week");
        renderTable();
      };
    });

    function generateTwoWeeksList() {
      const list = [];
      const startSun = getStartSunday(); 
      const today = getRealToday();
      today.setHours(0,0,0,0);

      for (let i = 0; i < 14; i++) {
        const d = new Date(startSun);
        d.setDate(startSun.getDate() + i);
        const compareDate = new Date(d);
        compareDate.setHours(0,0,0,0);

        list.push({
          dateStr: `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`,
          dayOfWeek: dayLabels[d.getDay()],
          dayIndex: d.getDay(),
          isToday: compareDate.getTime() === today.getTime(), 
          isSecondWeek: i >= 7, 
          dbKey: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
        });
      }
      return list;
    }
    
    const targetDays = generateTwoWeeksList();

    function updateUIElements() {
      const w1Start = targetDays[0].dateStr;
      const w1End = targetDays[6].dateStr;
      const w2Start = targetDays[7].dateStr;
      const w2End = targetDays[13].dateStr;
      document.getElementById("btn-week1").innerText = `1ページ目 (今週: ${w1Start}〜${w1End})`;
      document.getElementById("btn-week2").innerText = `2ページ目 (来週: ${w2Start}〜${w2End})`;
    }
    updateUIElements();

    function renderTable() {
      const container = document.getElementById("timetable-container");
      const displayDays = targetDays.filter(day => currentWeekView === "1" ? !day.isSecondWeek : day.isSecondWeek);

      let tableHtml = `<table><thead><tr><th>日付 (曜日)</th>`;
      periods.forEach(p => { tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`; });
      tableHtml += `</tr></thead><tbody>`;

      displayDays.forEach(dayInfo => {
        let dayClass = "";
        if (dayInfo.dayIndex === 6) dayClass = "day-sat";
        if (dayInfo.dayIndex === 0) dayClass = "day-sun";
        const rowClass = dayInfo.isToday ? "today-row" : "";

        tableHtml += `<tr class="${rowClass}"><td class="${dayClass}">${dayInfo.dateStr} (${dayInfo.dayOfWeek})</td>`;
        
        periods.forEach(period => {
          const slotKey = `${dayInfo.dbKey}_${period}`; 
          const reservedData = globalReservedMap[slotKey];

          if (reservedData) {
            let displayValue = reservedData.user;
            if (typeof displayValue === 'string' && displayValue.includes(':')) {
              const [savedType, savedName] = displayValue.split(':');
              displayValue = `[${savedType}] ${savedName}`;
            }
            const isSelected = selectedDocIds.has(reservedData.docId) ? "selected-to-delete" : "";
            const mark = selectedDocIds.has(reservedData.docId) ? "⚠️ 削除選択中" : "❌";

            tableHtml += `
              <td class="slot-cell slot-taken ${isSelected}" data-docid="${reservedData.docId}">
                ${mark}<span class="username">${displayValue}</span>
              </td>`;
          } else {
            tableHtml += `<td class="slot-cell slot-available">○</td>`;
          }
        });
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      container.querySelectorAll(".slot-taken").forEach(cell => {
        cell.onclick = () => {
          const docId = cell.getAttribute("data-docid");
          const usernameSpan = cell.querySelector(".username").innerText;
          if (selectedDocIds.has(docId)) {
            selectedDocIds.delete(docId);
            cell.classList.remove("selected-to-delete");
            cell.innerHTML = `❌<span class="username">${usernameSpan}</span>`;
          } else {
            selectedDocIds.add(docId);
            cell.classList.add("selected-to-delete");
            cell.innerHTML = `⚠️ 削除選択中<span class="username">${usernameSpan}</span>`;
          }
        };
      });
    }

    // 💡 設定を保存する処理
    document.getElementById("save-config").onclick = async () => {
      try {
        await setDoc(doc(db, "system_config", "current"), {
          limitBand: parseInt(document.getElementById("limit-band").value) || 99,
          limitDrum: parseInt(document.getElementById("limit-drum").value) || 1,
          limitPersonal: parseInt(document.getElementById("limit-personal").value) || 1,
          dayDrum: parseInt(document.getElementById("day-drum").value),
          dayPersonal: parseInt(document.getElementById("day-personal").value),
          forceUnlock: document.getElementById("force-unlock").value === "true"
        });
        alert("🎉 新しい予約ルールをデータベースに適用しました！\n部員の予約ページにも即座に反映されます。");
      } catch (e) {
        console.error("設定保存エラー:", e);
        alert("ルールの保存に失敗しました。");
      }
    };

    // 💡 設定データをリアルタイム監視して画面に初期反映
    onSnapshot(doc(db, "system_config", "current"), (docSnap) => {
      if (docSnap.exists()) {
        const config = docSnap.data();
        document.getElementById("limit-band").value = config.limitBand;
        document.getElementById("limit-drum").value = config.limitDrum;
        document.getElementById("limit-personal").value = config.limitPersonal;
        document.getElementById("day-drum").value = config.dayDrum;
        document.getElementById("day-personal").value = config.dayPersonal;
        document.getElementById("force-unlock").value = config.forceUnlock ? "true" : "false";
      }
    });

    document.getElementById("submit-delete").onclick = async () => {
      if (selectedDocIds.size === 0) { alert("削除したい予約枠（❌）を選択してください。"); return; }
      if (!confirm(`⚠️ 選択された ${selectedDocIds.size} 個の予約をまとめて削除しますか？`)) return;
      try {
        const batch = writeBatch(db);
        selectedDocIds.forEach(docId => { batch.delete(doc(db, "reservations", docId)); });
        await batch.commit();
        alert("🎉 削除が完了しました！");
        selectedDocIds.clear();
      } catch (error) {
        alert("削除に失敗しました。");
      }
    };

    onSnapshot(collection(db, "reservations"), (snapshot) => {
      globalReservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        globalReservedMap[data.slot] = { docId: doc.id, user: data.user };
      });
      renderTable();
    });
  </script>
</body>
</html>
