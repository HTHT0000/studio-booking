<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMFスタジオ予約 | 管理者画面</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: #c0392b;
      margin-bottom: 5px;
    }

    .admin-badge {
      text-align: center;
      background: #fce4d6;
      color: #d35400;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* 予約フォーム部分を「表示週切り替え」として再利用 */
    .reservation-form {
      max-width: 950px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-label {
      font-weight: bold;
      color: #444;
    }

    /* ボタン共通 */
    .btn-group {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      padding: 10px 20px;
      border: 2px solid #e74c3c;
      background: white;
      color: #e74c3c;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }

    .week-btn {
      border-color: #34495e;
      color: #34495e;
    }
    .week-btn.active {
      background: #34495e;
      color: white;
    }

    /* テーブル全体のスタイル */
    table {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 6px;
      text-align: center;
    }

    th {
      background: #e74c3c;
      color: white;
      font-weight: bold;
    }
    th:first-child {
      background: #c0392b;
      width: 140px;
    }

    td:first-child {
      background: #f9f9f9;
      font-weight: bold;
    }

    .day-sat { color: #2f80ed; }
    .day-sun { color: #eb5757; }

    /* 本日の日付の行を目立たせるスタイル */
    .today-row {
      background-color: #fff9db !important;
    }
    .today-row td:first-child {
      background-color: #fff3bf !important;
      position: relative;
    }
    .today-row td:first-child::after {
      content: " TODAY";
      font-size: 0.7em;
      color: #e67e22;
      display: block;
    }

    .slot-cell {
      transition: background 0.2s;
      font-size: 1.1em;
      min-width: 65px;
      user-select: none;
    }

    /* 空きコマ（管理者は操作不要なのでグレーアウトっぽく） */
    .slot-available {
      color: #bbb;
      background: #fafafa;
      font-size: 0.9em;
      cursor: not-allowed;
    }

    /* 予約済みコマ（管理者がタップして選べる状態） */
    .slot-taken {
      color: #eb4d4b;
      background: #fff5f5;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: bold;
    }
    .slot-taken:hover {
      background: #ffe3e3;
    }

    /* 削除対象として選択された状態 */
    .slot-taken.selected-to-delete {
      background: #ffd3d3 !important;
      color: #c0392b !important;
      outline: 2px solid #c0392b;
    }

    .username {
      display: block;
      font-size: 0.8em;
      color: #555;
      margin-top: 2px;
      word-break: break-all;
    }

    /* 一括削除ボタン */
    .action-container {
      max-width: 950px;
      margin: 20px auto 0 auto;
      text-align: center;
    }

    .submit-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>

  <div style="text-align: center;">
    <h1>FMFスタジオ予約【管理者専用】</h1>
    <div class="admin-badge">💡 削除したい「❌マークの予約枠」をタップして複数選択し、一番下のボタンで一括削除できます。</div>
  </div>

  <!-- 制御エリア -->
  <div class="reservation-form">
    <div class="form-row" style="width: 100%;">
      <span class="form-label">表示する週：</span>
      <div class="btn-group">
        <button type="button" id="btn-week1" class="toggle-btn week-btn active" data-week="1">1ページ目 (今週)</button>
        <button type="button" id="btn-week2" class="toggle-btn week-btn" data-week="2">2ページ目 (来週)</button>
      </div>
    </div>
  </div>
  
  <!-- 時刻表 -->
  <div id="timetable-container"></div>

  <!-- 一括削除ボタン -->
  <div class="action-container">
    <button type="button" id="submit-delete" class="submit-btn">選択した予約を一括削除する</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtXrNNvoSQE5OKBjJZTGzJku7fqPA05qM",
      authDomain: "fmfstudio-817fc.firebaseapp.com",
      projectId: "fmfstudio-817fc",
      storageBucket: "fmfstudio-817fc.firebasestorage.app",
      messagingSenderId: "688053367950",
      appId: "1:688053367950:web:6996a72a133b2bebb885df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentWeekView = "1"; 
    let selectedDocIds = new Set(); // 💡 削除用に選択したFirestoreのドキュメントIDをストックする場所
    let globalReservedMap = {}; 

    const periods = ["1", "2", "昼休み", "3", "4", "5", "6", "7"];
    const dayLabels = ["日", "月", "火", "水", "木", "金", "土"];

    function getRealToday() {
      return new Date();
    }

    function getStartSunday() {
      const today = getRealToday();
      const startSun = new Date(today);
      startSun.setDate(today.getDate() - today.getDay()); 
      return startSun;
    }

    document.querySelectorAll("[data-week]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[data-week]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentWeekView = btn.getAttribute("data-week");
        renderTable();
      };
    });

    function generateTwoWeeksList() {
      const list = [];
      const startSun = getStartSunday(); 
      const today = getRealToday();
      
      today.setHours(0,0,0,0);

      for (let i = 0; i < 14; i++) {
        const d = new Date(startSun);
        d.setDate(startSun.getDate() + i);
        
        const compareDate = new Date(d);
        compareDate.setHours(0,0,0,0);

        list.push({
          dateStr: `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`,
          dayOfWeek: dayLabels[d.getDay()],
          dayIndex: d.getDay(),
          isToday: compareDate.getTime() === today.getTime(), 
          isSecondWeek: i >= 7, 
          dbKey: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
        });
      }
      return list;
    }
    
    const targetDays = generateTwoWeeksList();

    function updateUIElements() {
      const w1Start = targetDays[0].dateStr;
      const w1End = targetDays[6].dateStr;
      const w2Start = targetDays[7].dateStr;
      const w2End = targetDays[13].dateStr;

      document.getElementById("btn-week1").innerText = `1ページ目 (今週: ${w1Start}〜${w1End})`;
      document.getElementById("btn-week2").innerText = `2ページ目 (来週: ${w2Start}〜${w2End})`;
    }
    updateUIElements();

    function renderTable() {
      const container = document.getElementById("timetable-container");
      const displayDays = targetDays.filter(day => currentWeekView === "1" ? !day.isSecondWeek : day.isSecondWeek);

      let tableHtml = `<table>`;
      tableHtml += `<thead><tr><th>日付 (曜日)</th>`;
      periods.forEach(p => { tableHtml += `<th>${p}${p !== "昼休み" ? "限" : ""}</th>`; });
      tableHtml += `</tr></thead><tbody>`;

      displayDays.forEach(dayInfo => {
        let dayClass = "";
        if (dayIndex === 6) dayClass = "day-sat";
        var dayIndex = dayInfo.dayIndex;
        if (dayIndex === 0) dayClass = "day-sun";

        const rowClass = dayInfo.isToday ? "today-row" : "";

        tableHtml += `<tr class="${rowClass}"><td class="${dayClass}">${dayInfo.dateStr} (${dayInfo.dayOfWeek})</td>`;
        
        periods.forEach(period => {
          const slotKey = `${dayInfo.dbKey}_${period}`; 
          const reservedData = globalReservedMap[slotKey];
          const isTaken = !!reservedData;

          if (isTaken) {
            let displayValue = reservedData.user;
            if (typeof displayValue === 'string' && displayValue.includes(':')) {
              const [savedType, savedName] = displayValue.split(':');
              displayValue = `[${savedType}] ${savedName}`;
            }

            // 💡 すでに選択リストに入っている場合は「✓」、そうでない場合は「❌」
            const isSelected = selectedDocIds.has(reservedData.docId) ? "selected-to-delete" : "";
            const mark = selectedDocIds.has(reservedData.docId) ? "⚠️ 削除選択中" : "❌";

            tableHtml += `
              <td class="slot-cell slot-taken ${isSelected}" data-docid="${reservedData.docId}">
                ${mark}<span class="username">${displayValue}</span>
              </td>`;
          } else {
            tableHtml += `<td class="slot-cell slot-available">○</td>`;
          }
        });
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;

      // 💡 予約済み枠（❌）のタップイベント
      container.querySelectorAll(".slot-taken").forEach(cell => {
        cell.onclick = () => {
          const docId = cell.getAttribute("data-docid");
          const usernameSpan = cell.querySelector(".username").innerText;
          
          if (selectedDocIds.has(docId)) {
            // 選択解除
            selectedDocIds.delete(docId);
            cell.classList.remove("selected-to-delete");
            // 中身のテキストを元に戻す
            cell.innerHTML = `❌<span class="username">${usernameSpan}</span>`;
          } else {
            // 選択
            selectedDocIds.add(docId);
            cell.classList.add("selected-to-delete");
            // 中身のテキストを削除選択中に変更
            cell.innerHTML = `⚠️ 削除選択中<span class="username">${usernameSpan}</span>`;
          }
        };
      });
    }

    // 💡 選択した枠を一括で削除する処理
    document.getElementById("submit-delete").onclick = async () => {
      if (selectedDocIds.size === 0) {
        alert("削除したい予約枠（❌）をタップして選択してください。");
        return;
      }

      if (!confirm(`⚠️ 選択された ${selectedDocIds.size} 個の予約をまとめて強制削除しますか？\n(この操作は取り消せません)`)) {
        return;
      }

      try {
        const batch = writeBatch(db);
        
        selectedDocIds.forEach(docId => {
          const docRef = doc(db, "reservations", docId);
          batch.delete(docRef);
        });

        await batch.commit(); // まとめて一瞬でFirebaseから削除
        
        alert("🎉 選択したすべての予約の削除が完了しました！");
        selectedDocIds.clear(); // 選択リストをリセット
      } catch (error) {
        console.error("一括削除エラー:", error);
        alert("一部、または全ての削除に失敗しました。");
      }
    };

    onSnapshot(collection(db, "reservations"), (snapshot) => {
      globalReservedMap = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        globalReservedMap[data.slot] = {
          docId: doc.id,
          user: data.user
        };
      });
      renderTable();
    });
  </script>
</body>

</html>
